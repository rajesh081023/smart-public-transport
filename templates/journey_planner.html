{% extends 'base.html' %}

{% block title %}Journey Planner{% endblock %}

{% block content %}
  <section class="card">
    <h1>Smart Journey Planner</h1>
    <p>Compare walking, cycling, metro, bus, EV, and car travel options.</p>
    <form method="post" action="/api/plan-journey">
      <label>Origin</label>
      <select name="origin_id">
        {% for stop in stops %}
          <option value="{{ stop.id }}">{{ stop.stop_name }}</option>
        {% endfor %}
      </select>

      <label>Destination</label>
      <select name="destination_id">
        {% for stop in stops %}
          <option value="{{ stop.id }}">{{ stop.stop_name }}</option>
        {% endfor %}
      </select>

      <button type="submit">Plan Journey</button>
    </form>
  </section>
{% endblock %}
