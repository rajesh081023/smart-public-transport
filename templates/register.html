{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
  <section class="card">
    <h1>Login</h1>
    <form method="post">
      <label>Email</label>
      <input type="email" name="email" required>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit">Login</button>
    </form>
  </section>
{% endblock %}
